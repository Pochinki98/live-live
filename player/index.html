<html>
<head>
<meta charset="UTF-8" />
<title>Noobie Player</title>
<link href="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/tcplayer.min.css" rel="stylesheet"/>
<script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/libs/TXLivePlayer-1.2.3.min.js"></script>
<script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/libs/hls.min.1.1.6.js"></script>
<script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/libs/flv.min.1.6.3.js"></script>
<script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/libs/dash.all.min.4.5.2.js"></script>
<script src="https://web.sdk.qcloud.com/player/tcplayer/release/v4.7.2/tcplayer.v4.7.2.min.js"></script>
</head>
<body bgcolor="black" style="margin:0">
<video id="player-container-id" style="width:100%;height:100%" preload="auto" playsinline webkit-playsinline></video>
<img id="logo" src="https://player.noobie.top/logo_new.png" style="width:56px; height:38px; z-index:999;position:absolute;right:5px;top:5px">
   <div id="realTimeClock" style="position:absolute; left:0px; top:0px; z-index:1000; color:white; background:rgba(0, 0, 0, 0); padding:5px; font-family:'Arial', sans-serif; border-radius:5px; width:80px; height:32px; display:flex; align-items:center; justify-content:center;">
        <!-- 时间将在这里显示 -->
   </div>
    <script>
        function updateClock() {
            var now = new Date(); // 获取当前时间
            var hours = now.getHours(); // 小时
            var minutes = now.getMinutes(); // 分钟
            var seconds = now.getSeconds(); // 秒
            minutes = minutes < 10 ? '0' + minutes : minutes; // 格式化分钟
            seconds = seconds < 10 ? '0' + seconds : seconds; // 格式化秒
            var timeString = hours + ':' + minutes + ':' + seconds;
            document.getElementById('realTimeClock').innerHTML = timeString; // 更新页面上的元素
        }
        setInterval(updateClock, 1000); // 每秒更新时间
        window.onload = updateClock; // 加载时更新时间
    </script>
<script>
playurl = location.href.split('?vurl=')[1];
var player = TCPlayer('player-container-id', {});
player.src(playurl);
player.autoplay(1);
</script>
</body>
</html>
